<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediCare — Pharmacy & Delivery</title>
    <meta name="description" content="Order medicines, upload prescriptions, and track delivery in real time. Modern pharmacy management for customers, pharmacies, and admins." />
    <meta name="author" content="MediCare" />

    <!-- PWA & Mobile App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediCare" />
    <link rel="apple-touch-icon" href="/placeholder.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph & Social Media -->
    <meta property="og:title" content="MediCare — Pharmacy & Delivery" />
    <meta property="og:description" content="Order medicines, upload prescriptions, and track delivery in real time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediCare — Pharmacy & Delivery" />
    <meta name="twitter:description" content="Order medicines, upload prescriptions, and track delivery in real time." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker for PWA Offline & Installation Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registered with scope:', reg.scope))
            .catch((err) => console.log('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
